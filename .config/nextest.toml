[profile.default]
test-threads = "num-cpus"

[profile.ci]
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 2 }
status-level = "fail"
final-status-level = "flaky"
# Full datasets stay local / language-parity.yml.
# PR CI: assist smoke for every locale, plus path-scoped parity (scripts/ci_lang_tests.py).
default-filter = "not (binary(parity_langs) | binary(voice_suite) | binary(full_home))"

[profile.ci-lang]
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "180s", terminate-after = 2 }
status-level = "fail"
final-status-level = "flaky"
