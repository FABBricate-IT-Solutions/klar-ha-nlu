[profile.default]
fail-fast = false
test-threads = "num-cpus"

[profile.ci]
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 2 }
status-level = "fail"
final-status-level = "flaky"
# Full Wohn+Family+m0+m2 for every compiled locale. voice_suite / full_home stay local.
default-filter = "not (binary(voice_suite) | binary(full_home))"

[profile.ci-lang]
fail-fast = false
test-threads = "num-cpus"
slow-timeout = { period = "180s", terminate-after = 2 }
status-level = "fail"
final-status-level = "flaky"
