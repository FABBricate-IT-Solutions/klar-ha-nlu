name: Bug
description: Something Klar NLU does wrong in Assist or the engine
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Household setup is in [getting started](https://github.com/FABBricate-IT-Solutions/klar-ha-nlu/blob/main/docs/en/getting-started.md). Vulnerabilities go to [Security advisories](https://github.com/FABBricate-IT-Solutions/klar-ha-nlu/security/advisories/new), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: Phrase, expected intent, what Assist did instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "2026.8.30 (engine + integration, same CalVer)"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Assist language
      options:
        - de
        - en
        - fr
        - other compiled locale
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps
      placeholder: HACS / add-on / Docker, expose, pipeline, phrase
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report has no tokens, raw support-bundle text, or unredacted entity names
          required: true
