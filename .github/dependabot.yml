version: 2
# Dependabot reads this file from the default branch only. Each ecosystem is
# listed twice so main and staging both get update pull requests.
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      rust-patch:
        update-types:
          - patch
      rust-minor:
        update-types:
          - minor
    commit-message:
      prefix: cargo

  - package-ecosystem: cargo
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      rust-patch:
        update-types:
          - patch
      rust-minor:
        update-types:
          - minor
    ignore:
      # jiff 1.0 removes Timestamp::to_zoned; clock_time.rs still calls it.
      - dependency-name: jiff
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: cargo

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    # Actions are pinned by commit SHA with the version in a trailing comment;
    # Dependabot raises both. dtolnay/rust-toolchain is pinned to a commit on its
    # master branch and the MSRV sits in its `toolchain:` input, so a new
    # SHA cannot move the toolchain (tests/test_ci_workflows.py holds that).
    commit-message:
      prefix: ci

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /web
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-patch:
        update-types:
          - patch
      npm-minor:
        update-types:
          - minor
    commit-message:
      prefix: npm

  - package-ecosystem: npm
    directory: /web
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-patch:
        update-types:
          - patch
      npm-minor:
        update-types:
          - minor
    commit-message:
      prefix: npm

  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-patch:
        update-types:
          - patch
    # Node 25 is end of life. CI and the image stay on the 24 LTS line.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: docker

  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-patch:
        update-types:
          - patch
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: docker

  - package-ecosystem: docker
    directory: /docker
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-patch:
        update-types:
          - patch
    commit-message:
      prefix: docker

  - package-ecosystem: docker
    directory: /docker
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-patch:
        update-types:
          - patch
    commit-message:
      prefix: docker
