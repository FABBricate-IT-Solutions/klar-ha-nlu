name: Build
# Pin Ubuntu 26.04. ubuntu-latest moves to this image through November 2026.
#
# Publish order (package 5.1 / V-02, V-05, V-09):
#   build both arches → load container → SIGTERM smoke → scan →
#   then push images + multi-arch manifest → GitHub Release.
# The Release workflow lands the add-on version on main only after this succeeds.

on:
  push:
    tags: ["v*", "20*"]
  workflow_call:
    inputs:
      release_tag:
        description: Tag to publish as a GitHub Release
        required: false
        type: string
        default: ""
      prerelease:
        description: Staging RC — prerelease, Docker tag staging, never latest
        required: false
        type: boolean
        default: false

# Nothing by default: every job states what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  GHCR: ghcr.io/fabbricate-it-solutions/klar-nlu

jobs:
  build:
    name: ${{ matrix.name }}
    # Tag-push of an RC must not run Build on its own (would retag latest).
    # Staging.yml calls this workflow with release_tag after it creates the tag.
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' && (contains(github.ref_name, '-staging.') || contains(github.ref_name, '-rc.'))) }}
    runs-on: ubuntu-26.04
    # Builds the binary and a local image. Pushing waits for every arch (docker-publish).
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # musl-static: HA Core is Alpine. gnu binaries execve with ENOENT there.
          - target: x86_64-unknown-linux-musl
            name: linux-x86_64
            ha_arch: amd64
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            name: linux-aarch64
            ha_arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@0375eb1d01bea430aa3202965839a7092960a23b # v1.43.1
        with:
          target: ${{ matrix.target }}
      # No build cache here: these binaries are published, so nothing restored from an
      # earlier run goes into them.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build UI
        working-directory: web
        run: npm ci && npm run build
      - name: Package
        run: |
          dest="klar-${{ matrix.name }}"
          python3 scripts/third-party-notices.py > THIRD_PARTY
          cp "target/${{ matrix.target }}/release/klar" klar
          chmod +x klar
          rm -rf ui
          cp -R web/dist ui
          tar -czf "${dest}.tar.gz" klar LICENSE THIRD_PARTY ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klar-${{ matrix.name }}
          path: klar-${{ matrix.name }}.tar.gz
          if-no-files-found: error
      - name: Image version
        if: github.event_name != 'pull_request'
        id: meta
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          addon="$(sed -n 's/^version: "\([^"]*\)"/\1/p' addon/config.yaml | head -1)"
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v?[0-9]+(\.[0-9]+)+(-((rc|staging)\.[A-Za-z0-9]+))?$ ]]; then
            echo "Invalid release_tag format: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/tags/20* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$addon" >> "$GITHUB_OUTPUT"
            echo "edge=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ inputs.prerelease }}" == "true" || "$RELEASE_TAG" == *-staging.* || "$RELEASE_TAG" == *-rc.* || "$GITHUB_REF_NAME" == *-staging.* || "$GITHUB_REF_NAME" == *-rc.* ]]; then
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: github.event_name != 'pull_request'
      - name: Build container
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cp LICENSE docker/LICENSE
          cp THIRD_PARTY docker/THIRD_PARTY
          cp "target/${{ matrix.target }}/release/klar" docker/klar
          cp scripts/klar-entry.sh docker/klar-entry.sh
          rm -rf docker/ui
          cp -R web/dist docker/ui
          chmod +x docker/klar docker/klar-entry.sh
          local_tag="klar-local-${{ matrix.ha_arch }}:${VERSION}"
          docker buildx build --platform "${{ matrix.platform }}" --load \
            -f docker/Dockerfile -t "$local_tag" docker/
          echo "local_tag=$local_tag" >> "$GITHUB_ENV"
      - name: Smoke SIGTERM
        if: github.event_name != 'pull_request'
        run: bash scripts/docker-smoke.sh "$local_tag"
      - name: Scan local image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.local_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: "1"
      - name: Save image artifact
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker save "$local_tag" | gzip > "klar-image-${{ matrix.ha_arch }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: klar-image-${{ matrix.ha_arch }}
          path: klar-image-${{ matrix.ha_arch }}.tar.gz
          if-no-files-found: error

  docker-publish:
    name: docker-publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.push.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: images
          pattern: klar-image-*
          merge-multiple: true
      - name: Push images and manifest
        id: push
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          addon="$(sed -n 's/^version: "\([^"]*\)"/\1/p' addon/config.yaml | head -1)"
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v?[0-9]+(\.[0-9]+)+(-((rc|staging)\.[A-Za-z0-9]+))?$ ]]; then
            echo "Invalid release_tag format: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/tags/20* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "$RELEASE_TAG" ]]; then
            version="${RELEASE_TAG#v}"
          else
            version="$addon"
            extra_edge=true
          fi
          channel=""
          if [[ "$PRERELEASE" == "true" || "$RELEASE_TAG" == *-staging.* || "$RELEASE_TAG" == *-rc.* || "$GITHUB_REF_NAME" == *-staging.* || "$GITHUB_REF_NAME" == *-rc.* ]]; then
            channel=staging
          fi
          src=()
          for arch in amd64 aarch64; do
            archive="images/klar-image-${arch}.tar.gz"
            if [[ ! -f "$archive" ]]; then
              echo "missing image artifact: $archive" >&2
              exit 1
            fi
            gzip -dc "$archive" | docker load
            local_tag="klar-local-${arch}:${version}"
            image="${GHCR}-${arch}"
            docker tag "$local_tag" "${image}:${version}"
            tags=("${image}:${version}")
            if [[ "${extra_edge:-}" == "true" ]]; then
              docker tag "$local_tag" "${image}:edge"
              tags+=("${image}:edge")
            fi
            if [[ "$channel" == "staging" ]]; then
              docker tag "$local_tag" "${image}:staging"
              tags+=("${image}:staging")
            elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/tags/20* || -n "$RELEASE_TAG" ]]; then
              docker tag "$local_tag" "${image}:latest"
              tags+=("${image}:latest")
            fi
            for tag in "${tags[@]}"; do
              docker push "$tag"
            done
            src+=("${image}:${version}")
          done
          docker buildx imagetools create -t "${GHCR}:${version}" "${src[@]}"
          if [[ "${extra_edge:-}" == "true" ]]; then
            docker buildx imagetools create -t "${GHCR}:edge" "${src[@]}"
          fi
          if [[ "$channel" == "staging" ]]; then
            docker buildx imagetools create -t "${GHCR}:staging" "${src[@]}"
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/tags/20* || -n "$RELEASE_TAG" ]]; then
            docker buildx imagetools create -t "${GHCR}:latest" "${src[@]}"
          fi
          echo "image=${GHCR}:${version}" >> "$GITHUB_OUTPUT"

  trivy:
    name: trivy
    if: github.event_name != 'pull_request'
    needs: docker-publish
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ needs.docker-publish.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always()
        with:
          sarif_file: trivy-results.sarif

  release:
    name: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/20') || inputs.release_tag != '' }}
    needs: [docker-publish, trivy]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # "Release notes" fetches origin/main with this checkout's credentials.
        with: # zizmor: ignore[artipacked]
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: klar-linux-*
          merge-multiple: true
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: klar.cdx.json
          output-file: dist/klar.cdx.json
          upload-release-assets: false
      - name: Release notes
        env:
          RAW_TAG: ${{ inputs.release_tag || github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          tag="${RAW_TAG#refs/tags/}"
          tag="${tag#v}"
          # CHANGELOG.md is written at prepare time. `git-cliff --latest` is
          # empty after a squash whose subject is `chore(release):` because
          # cliff.toml skips those commits. Staging RCs list commits since main,
          # not the last stable CHANGELOG section.
          if [[ "$PRERELEASE" == "true" ]]; then
            git fetch --no-tags --depth=1 origin main || true
            {
              echo "> **Staging / release candidate.** Not a production cut."
              echo ">"
              echo "> Built from branch \`staging\`. Docker tags: \`staging\` and this RC tag."
              echo "> Stable remains CalVer / \`latest\` from \`main\`."
              echo
              python3 scripts/release-notes.py --since origin/main \
                || echo "No non-merge commits since main yet."
            } > CHANGES.md
          else
            python3 scripts/release-notes.py "$tag" > CHANGES.md
          fi
      - name: Release identity
        id: rel
        env:
          RAW_TAG: ${{ inputs.release_tag || github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          raw="$RAW_TAG"
          title="${raw#v}"
          echo "tag=$raw" >> "$GITHUB_OUTPUT"
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "title=${title} (staging RC)" >> "$GITHUB_OUTPUT"
          else
            echo "title=${title}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.title }}
          files: |
            dist/*.tar.gz
            dist/klar.cdx.json
          body_path: CHANGES.md
          generate_release_notes: false
          prerelease: ${{ inputs.prerelease || contains(inputs.release_tag, '-staging.') }}
          make_latest: ${{ inputs.prerelease != true && !contains(inputs.release_tag, '-staging.') }}
