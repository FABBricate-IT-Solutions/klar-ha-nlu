name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "20*"]
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        description: Tag to publish as a GitHub Release
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  GHCR: ghcr.io/fabbricate-it-solutions/klar-nlu

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ha_arch: amd64
            platform: linux/amd64
          - target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            ha_arch: aarch64
            platform: linux/arm64
          - target: armv7-unknown-linux-gnueabihf
            name: linux-armv7
            ha_arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          dest="klar-${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/klar" "$dest"
          chmod +x "$dest"
          tar -czf "${dest}.tar.gz" "$dest"
      - uses: actions/upload-artifact@v7
        with:
          name: klar-${{ matrix.name }}
          path: klar-${{ matrix.name }}.tar.gz
          if-no-files-found: error
      - name: Image version
        if: github.event_name != 'pull_request'
        id: meta
        run: |
          addon="$(sed -n 's/^version: "\([^"]*\)"/\1/p' addon/config.yaml | head -1)"
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ github.ref }}" == refs/tags/20* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            t="${{ inputs.release_tag }}"
            echo "version=${t#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$addon" >> "$GITHUB_OUTPUT"
            echo "edge=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push container
        if: github.event_name != 'pull_request'
        run: |
          cp "target/${{ matrix.target }}/release/klar" docker/klar
          chmod +x docker/klar
          image="${GHCR}-${{ matrix.ha_arch }}"
          version="${{ steps.meta.outputs.version }}"
          tags=(-t "$image:$version")
          if [[ "${{ steps.meta.outputs.edge }}" == "true" ]]; then
            tags+=(-t "$image:edge")
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ github.ref }}" == refs/tags/20* || -n "${{ inputs.release_tag }}" ]]; then
            tags+=(-t "$image:latest")
          fi
          docker buildx build --platform "${{ matrix.platform }}" --push \
            -f docker/Dockerfile "${tags[@]}" docker/

  docker-manifest:
    name: docker-manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch tags
        run: |
          addon="$(sed -n 's/^version: "\([^"]*\)"/\1/p' addon/config.yaml | head -1)"
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ github.ref }}" == refs/tags/20* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            t="${{ inputs.release_tag }}"
            version="${t#v}"
          else
            version="$addon"
            extra_edge=true
          fi
          src=(
            "${GHCR}-amd64:${version}"
            "${GHCR}-aarch64:${version}"
            "${GHCR}-armv7:${version}"
          )
          docker buildx imagetools create -t "${GHCR}:${version}" "${src[@]}"
          if [[ "${extra_edge:-}" == "true" ]]; then
            docker buildx imagetools create -t "${GHCR}:edge" "${src[@]}"
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* || "${{ github.ref }}" == refs/tags/20* || -n "${{ inputs.release_tag }}" ]]; then
            docker buildx imagetools create -t "${GHCR}:latest" "${src[@]}"
          fi

  release:
    name: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/20') || inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Release identity
        id: rel
        run: |
          raw="${{ inputs.release_tag || github.ref_name }}"
          echo "tag=$raw" >> "$GITHUB_OUTPUT"
          echo "title=${raw#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.title }}
          files: dist/*.tar.gz
          body_path: CHANGES.md
          generate_release_notes: false
