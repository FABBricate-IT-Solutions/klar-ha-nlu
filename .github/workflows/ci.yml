name: CI
# Pin Ubuntu 26.04. ubuntu-latest moves to this image through November 2026.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      nextest_profile:
        description: "nextest profile (ci or ci-staging)"
        type: string
        required: false
        default: ci

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.91"
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.91"
          components: clippy
      # One cache per job: clippy stores check artefacts of the dev profile, the test
      # jobs need optimised test-profile builds. A shared key gave the test job a
      # cache it could not use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-clippy
          cache-on-failure: true
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- \
            -D warnings \
            -D clippy::undocumented_unsafe_blocks \
            -D clippy::dbg_macro \
            -D clippy::todo

  test:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CalVer bump script
        run: python3 scripts/bump-version.py --self-test
      - name: Release cut script
        run: bash scripts/cut-release.sh --self-test
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Language pack gates
        run: python3 scripts/check_lang_packs.py
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.91"
          components: rustfmt
      # Every generator, then the whole tree must be unchanged (translations included).
      - name: Generators are a no-op
        run: bash scripts/check_generated.sh
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-test
          cache-on-failure: true
      - name: Nextest profile
        id: nextest
        env:
          REQUESTED_PROFILE: ${{ inputs.nextest_profile }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          profile="${REQUESTED_PROFILE}"
          if [[ -z "${profile}" ]]; then
            if [[ "${BASE_REF}" == "staging" ]]; then
              profile=ci-staging
            else
              profile=ci
            fi
          fi
          case "${profile}" in
            ci|ci-staging|ci-lang) ;;
            *)
              echo "unsupported nextest profile: ${profile}" >&2
              exit 1
              ;;
          esac
          echo "profile=${profile}" >> "$GITHUB_OUTPUT"
          echo "Using nextest profile: ${profile}"
      - name: Test
        timeout-minutes: 30
        env:
          NEXTEST_PROFILE: ${{ steps.nextest.outputs.profile }}
        run: |
          set -euo pipefail
          # A temp directory of its own, so the next step sees what the tests left behind.
          export TMPDIR="${RUNNER_TEMP}/klar-tests"
          mkdir -p "${TMPDIR}"
          cargo nextest run --locked --profile "${NEXTEST_PROFILE}" --no-fail-fast
      - name: Tests left nothing in the temp directory
        run: |
          set -euo pipefail
          left="$(ls -A "${RUNNER_TEMP}/klar-tests")"
          if [[ -n "$left" ]]; then
            echo "$left"
            echo "tests left files behind; use a scratch directory that is removed on drop (TestDir or tempfile)" >&2
            exit 1
          fi

  # Package 3.4 / Q-12: latency and leak gates against a 4096-entity home (Release).
  budget:
    name: request-budget
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.91"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-budget
          cache-on-failure: true
      - name: Latency and leak gates (release)
        run: cargo nextest run --locked --release --no-fail-fast -E 'binary(request_budget)'

  # Klar's own dataset suites (wohnung_*, full_home, per-locale wohnung overlay).
  # The filter lives in .config/nextest.toml, profile ci-datasets. The full tier is
  # `#[ignore]`, so it only runs because of --run-ignored all.
  datasets:
    name: dataset-suites
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.91"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-datasets
          cache-on-failure: true
      - name: Own dataset suites
        run: |
          cargo nextest run --locked --profile ci-datasets --run-ignored all --no-fail-fast \
            --test voice_suite --test full_home --test parity_langs \
            --status-level pass --success-output final

  # The operator UI: types, lint, component tests against a mocked engine API, the build
  # the engine serves, and a size limit for it. `npm ci` installs from web/package-lock.json
  # only, so a missing or stale lockfile fails here.
  web:
    name: web
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lockfile is committed
        run: |
          if [[ ! -f package-lock.json ]]; then
            echo "web/package-lock.json is missing; the UI must build from a lockfile" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Component tests
        run: npm test
      - name: Build UI
        run: npm run build
      - name: Bundle budget
        run: npm run budget

  # The built UI in a real browser against a real engine binary: first-run wizard, a
  # settings round trip, a Lab parse, a stored house rule and the navigation.
  web-smoke:
    name: web-smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-web-smoke
          cache-on-failure: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the engine
        run: cargo build --locked
      - name: Build the UI
        working-directory: web
        run: npm ci && npm run build
      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Smoke test
        working-directory: web
        run: npm run e2e

  # The integration inside a real Home Assistant core: dispatch against the real service
  # registry, the config-entry lifecycle and the ChatLog path, plus lint and a type check.
  # Versions are pinned in tests/ha_real/requirements.txt.
  ha:
    name: ha
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: tests/ha_real/requirements.txt
      - name: Install Home Assistant test tools
        run: uv pip install -r tests/ha_real/requirements.txt
      - name: Ruff
        run: ruff check
      - name: Type check
        run: mypy
      - name: Tests against a real Home Assistant
        timeout-minutes: 10
        run: pytest -q

  # Package 6.10 / Q-08: the held-out scorecard with its reject and corpus gates, the Home
  # Assist default agent (hassil + gazetteer) on the same sentences, and one artifact that
  # joins them and names the commit. benchmark_report.py refuses runs of different commits.
  benchmark:
    name: benchmark
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      KLAR_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-benchmark
          cache-on-failure: true
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: scripts/requirements-assist-bench.txt
      - name: Install the Assist packages (pinned with Home Assistant)
        run: uv pip install -r scripts/requirements-assist-bench.txt
      - name: Klar scorecard gate
        run: cargo run --locked --release -- eval gate --out target/benchmark/scorecard.json > /dev/null
      - name: Assist on the same held-out sentences
        run: python scripts/bench_assist.py --suite heldout_en --suite heldout_de --out target/benchmark/assist.json
      - name: Join both runs under the commit
        run: |
          set -euo pipefail
          python scripts/benchmark_report.py \
            --scorecard target/benchmark/scorecard.json \
            --assist target/benchmark/assist.json \
            --out target/benchmark/benchmark.json \
            --markdown target/benchmark/benchmark.md
          cat target/benchmark/benchmark.md >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ github.sha }}
          path: target/benchmark/
          if-no-files-found: error
          retention-days: 30

  # Cheap checks on the CI definition itself and on the docs.
  lint:
    name: ci-lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: actionlint, zizmor, shellcheck
        run: bash scripts/lint_ci.sh
      - name: Links between the Markdown files
        run: python3 scripts/check_links.py

  # Package 5.1 / V-09: release musl targets and the add-on Dockerfile on every PR.
  release-targets:
    name: release-targets
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: linux-x86_64
            ha_arch: amd64
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            name: linux-aarch64
            ha_arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.91"
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@0375eb1d01bea430aa3202965839a7092960a23b # v1.43.1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-release-${{ matrix.target }}
          cache-on-failure: true
      - name: Release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        working-directory: web
        run: npm ci && npm run build
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Add-on image and SIGTERM smoke
        run: |
          set -euo pipefail
          python3 scripts/third-party-notices.py > THIRD_PARTY
          cp LICENSE docker/LICENSE
          cp THIRD_PARTY docker/THIRD_PARTY
          cp "target/${{ matrix.target }}/release/klar" docker/klar
          cp scripts/klar-entry.sh docker/klar-entry.sh
          rm -rf docker/ui
          cp -R web/dist docker/ui
          chmod +x docker/klar docker/klar-entry.sh
          tag="klar-ci-${{ matrix.ha_arch }}:pr"
          docker buildx build --platform "${{ matrix.platform }}" --load \
            -f docker/Dockerfile -t "$tag" docker/
          bash scripts/docker-smoke.sh "$tag"

  # Package 5.1 / V-09: the root Dockerfile (source build) on every PR.
  dockerfile-root:
    name: dockerfile-root
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Root Dockerfile and SIGTERM smoke
        run: |
          set -euo pipefail
          docker buildx build --load -f Dockerfile -t klar-nlu:ci .
          bash scripts/docker-smoke.sh klar-nlu:ci

  # Required check on staging. It passes only when every job it needs succeeded, so a new
  # job gates merges by being listed here, without a change to the repository settings.
  # tests/test_ci_workflows.py fails when a job of this workflow is missing from the list.
  release-gates:
    name: release-gates
    needs: [test, clippy, rustfmt, web, web-smoke, ha, datasets, budget, benchmark, lint, release-targets, dockerfile-root]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [[ -n "$failed" ]]; then
            echo "not successful: $failed" >&2
            exit 1
          fi
