name: CI
# Pin Ubuntu 26.04. ubuntu-latest moves to this image through November 2026.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      nextest_profile:
        description: "nextest profile (ci or ci-staging)"
        type: string
        required: false
        default: ci

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy
      # One cache per job: clippy stores check artefacts of the dev profile, the test
      # jobs need optimised test-profile builds. A shared key gave the test job a
      # cache it could not use.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy
          cache-on-failure: true
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- \
            -D warnings \
            -D clippy::undocumented_unsafe_blocks \
            -D clippy::dbg_macro \
            -D clippy::todo

  test:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: CalVer bump script
        run: python3 scripts/bump-version.py --self-test
      - name: Release cut script
        run: bash scripts/cut-release.sh --self-test
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Language pack gates
        run: python3 scripts/check_lang_packs.py
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt
      - name: Generators are a no-op
        run: |
          set -euo pipefail
          python3 scripts/lang_packs/generate.py
          python3 scripts/parity/generate.py
          python3 scripts/full_home/generate.py
          cargo fmt --all
          paths=(
            src/lang/packs
            src/lang/registry.rs
            src/lang/packs/mod.rs
            tests/assist_langs.rs
            tests/full_home.rs
            tests/datasets
            custom_components/klar_nlu/languages.py
            custom_components/klar_nlu/speech_locale.py
            src/llm/refine_shots.rs
            src/llm/refine_shots_a.rs
            src/llm/refine_shots_b.rs
            src/llm/refine_shots_c.rs
            src/llm/refine_shots_d.rs
            src/llm/refine_shots_e.rs
            src/llm/refine_shots_f.rs
            src/speech/generated.rs
          )
          dirty="$(git status --porcelain -- "${paths[@]}")"
          if [[ -n "$dirty" ]]; then
            echo "$dirty"
            git diff -- "${paths[@]}"
            echo "generated language packs or datasets are stale; run python3 scripts/lang_packs/generate.py && python3 scripts/parity/generate.py && python3 scripts/full_home/generate.py && cargo fmt --all" >&2
            exit 1
          fi
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
          cache-on-failure: true
      - name: Nextest profile
        id: nextest
        run: |
          set -euo pipefail
          profile="${{ inputs.nextest_profile }}"
          if [[ -z "${profile}" ]]; then
            if [[ "${{ github.base_ref }}" == "staging" ]]; then
              profile=ci-staging
            else
              profile=ci
            fi
          fi
          case "${profile}" in
            ci|ci-staging|ci-lang) ;;
            *)
              echo "unsupported nextest profile: ${profile}" >&2
              exit 1
              ;;
          esac
          echo "profile=${profile}" >> "$GITHUB_OUTPUT"
          echo "Using nextest profile: ${profile}"
      - name: Test
        timeout-minutes: 30
        run: cargo nextest run --locked --profile ${{ steps.nextest.outputs.profile }} --no-fail-fast

  # Klar's own dataset suites (wohnung_*, full_home, per-locale wohnung overlay).
  # The filter lives in .config/nextest.toml, profile ci-datasets. The full tier is
  # `#[ignore]`, so it only runs because of --run-ignored all.
  datasets:
    name: dataset-suites
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-datasets
          cache-on-failure: true
      - name: Own dataset suites
        run: |
          cargo nextest run --locked --profile ci-datasets --run-ignored all --no-fail-fast \
            --test voice_suite --test full_home --test parity_langs \
            --status-level pass --success-output final

  # The operator UI: types, lint, component tests against a mocked engine API, the build
  # the engine serves, and a size limit for it. `npm ci` installs from web/package-lock.json
  # only, so a missing or stale lockfile fails here.
  web:
    name: web
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Lockfile is committed
        run: |
          if [[ ! -f package-lock.json ]]; then
            echo "web/package-lock.json is missing; the UI must build from a lockfile" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Component tests
        run: npm test
      - name: Build UI
        run: npm run build
      - name: Bundle budget
        run: npm run budget

  # The built UI in a real browser against a real engine binary: first-run wizard, a
  # settings round trip, a Lab parse, a stored house rule and the navigation.
  web-smoke:
    name: web-smoke
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-web-smoke
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the engine
        run: cargo build --locked
      - name: Build the UI
        working-directory: web
        run: npm ci && npm run build
      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Smoke test
        working-directory: web
        run: npm run e2e

  # The integration inside a real Home Assistant core: dispatch against the real service
  # registry, the config-entry lifecycle and the ChatLog path, plus lint and a type check.
  # Versions are pinned in tests/ha_real/requirements.txt.
  ha:
    name: ha
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: tests/ha_real/requirements.txt
      - name: Install Home Assistant test tools
        run: uv pip install -r tests/ha_real/requirements.txt
      - name: Ruff
        run: ruff check
      - name: Type check
        run: mypy
      - name: Tests against a real Home Assistant
        timeout-minutes: 10
        run: pytest -q

  # Required check on staging. It passes only when every job it needs succeeded, so a new
  # job gates merges by being listed here, without a change to the repository settings.
  # tests/test_ci_workflows.py fails when a job of this workflow is missing from the list.
  release-gates:
    name: release-gates
    needs: [test, clippy, rustfmt, web, web-smoke, ha, datasets]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [[ -n "$failed" ]]; then
            echo "not successful: $failed" >&2
            exit 1
          fi
