name: CI

on:
  push:
    branches: [main, "release/v*", "release/20*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: CalVer bump script
        run: python3 scripts/bump-version.py --self-test
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked -- --test-threads=1

  release-gates:
    name: release-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Privacy, migrate, policy, contract, semantic
        run: cargo test --locked --test privacy --test migrate --test policy --test contract --test semantic -- --test-threads=1
      - name: Held-out quality
        run: cargo test --locked --test eval held_out -- --test-threads=1
      - name: Language packs
        run: cargo run --locked --quiet -- lang validate packs
      - name: Bench smoke
        run: cargo run --locked --quiet -- eval bench --repeat 8
