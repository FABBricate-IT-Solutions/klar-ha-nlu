name: Language parity
# Pin Ubuntu 26.04. ubuntu-latest moves to this image through November 2026.

# Every compiled locale: the full parity rubric, the conversation overlay and both
# full-home tiers. Too slow for every pull request (about 15 CPU minutes for the
# full tier alone), so weekly or by hand. Locales that are not at zero have a
# recorded ceiling in tests/fixtures/suite_bounds.yaml; more failures fail the run.
on:
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  parity:
    name: parity-langs
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: language-parity
          cache-on-failure: true
      - name: Per-locale parity and conversation overlay
        run: cargo nextest run --locked --profile ci-lang --no-fail-fast --run-ignored all --test parity_langs
      - name: Full-home quick and full (every locale)
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked --profile ci-lang --no-fail-fast --run-ignored all --test full_home
