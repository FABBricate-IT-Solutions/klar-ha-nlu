name: Promote
# Pin Ubuntu 26.04. ubuntu-latest moves to this image through November 2026.

# Weekly (and manual) staging → main promotion PR. Does not merge; does not cut
# a release. The Release workflow still owns CalVer tags after a merge to main.
on:
  schedule:
    # Monday 06:00 UTC — keep stable within a week of staging fixes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: promote-staging-main
  cancel-in-progress: false

permissions: {}

jobs:
  open-pr:
    name: open-pr
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Open or refresh staging → main PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/promote-staging.sh
