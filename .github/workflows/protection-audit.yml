name: Protection audit
# Pin Ubuntu 26.04. ubuntu-latest moves to this image through November 2026.

# Weekly (and manual) compare of live GitHub rulesets / immutable releases
# against .github/protection/desired.yaml (package 5.3 / V-06).
on:
  schedule:
    # Monday 07:00 UTC — after the promote job (06:00).
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: protection-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: protection-audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: pip install --user "pyyaml==6.0.2"

      - name: Compare live settings to desired.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/audit_protection.py --require-live
