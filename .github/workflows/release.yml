name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Empty = next YYYY.M.PATCH (Home Assistant CalVer). Or set 2026.8.0
        type: string
        required: false
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.land.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Next version
        id: ver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION" ]]; then
            version="$VERSION"
          else
            version="$(python3 scripts/bump-version.py next)"
          fi
          version="$(tr -d '[:space:]' <<<"$version")"
          version="${version#v}"
          tag="$version"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — nothing to release" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump crate and add-on versions
        run: python3 scripts/bump-version.py "${{ steps.ver.outputs.version }}"

      - name: Write CHANGELOG.md
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          tag = os.environ["TAG"].lstrip("v")
          generated = subprocess.check_output(["git-cliff", "--tag", tag], text=True)
          start = generated.find(f"## [{tag}]")
          if start < 0:
              raise SystemExit(f"git-cliff produced no heading for {tag}")
          nxt = generated.find("\n## [", start + 1)
          section = generated[start : nxt if nxt >= 0 else None].rstrip() + "\n\n"
          path = Path("CHANGELOG.md")
          existing = path.read_text()
          body_at = existing.find("## [")
          if body_at < 0:
              raise SystemExit("CHANGELOG.md has no version heading")
          path.write_text(existing[:body_at] + section + existing[body_at:])
          PY

      - name: Land release commit on main
        id: land
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/${TAG}"
          git checkout -B "$branch"
          git add Cargo.toml Cargo.lock config.yaml addon/config.yaml \
            custom_components/klar_nlu/manifest.json \
            custom_components/klar_nlu/const.py CHANGELOG.md
          git commit -m "chore(release): prepare for ${TAG}"
          sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${branch}"

          # GITHUB_TOKEN PRs do not start required checks. Dispatch CI ourselves,
          # fast-forward main, and tag in this job.
          gh workflow run CI --ref "$branch"
          gh workflow run Security --ref "$branch"
          gh workflow run Validate --ref "$branch"
          echo "Actions cannot open PRs; waiting for required checks on ${sha}"
          required=(rustfmt clippy test cargo-audit cargo-deny hassfest hacs)
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            payload="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100")"
            failed=0
            pending=0
            for name in "${required[@]}"; do
              conclusion="$(jq -r --arg n "$name" '
                [.check_runs[] | select(.name == $n)]
                | if length == 0 then "pending"
                  else sort_by(.started_at) | last | .conclusion // "pending"
                  end
              ' <<<"$payload")"
              echo "${name}: ${conclusion}"
              case "$conclusion" in
                success|skipped) ;;
                failure|cancelled|timed_out|stale) failed=1 ;;
                *) pending=1 ;;
              esac
            done
            if (( failed )); then
              echo "Required check failed" >&2
              exit 1
            fi
            if (( pending == 0 )); then
              git push origin "${sha}:refs/heads/main"
              git tag -a "$TAG" -m "$TAG"
              git push origin "refs/tags/${TAG}"
              git push origin --delete "$branch" || true
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for required checks on ${sha}" >&2
          exit 1

  publish-tag:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
    name: publish-tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release tag
        id: tag
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="$(sed -n 's/^chore(release): prepare for \(v\?[0-9][0-9.]*\).*/\1/p' <<<"$MESSAGE" | head -1)"
          tag="${tag#v}"
          if [[ -z "$tag" ]]; then
            echo "Commit is not a versioned release prepare" >&2
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"

  publish-release:
    needs: [prepare, publish-tag]
    if: always() && !cancelled() && (needs.prepare.outputs.tag != '' || needs.publish-tag.outputs.tag != '')
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.prepare.outputs.tag || needs.publish-tag.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
