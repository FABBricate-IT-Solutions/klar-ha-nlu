name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Empty = next YYYY.M.PATCH (Home Assistant CalVer). Or set 2026.8.0
        type: string
        required: false

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

# Tag/publish only after fmt, clippy, nextest, pack freshness, web, audit, deny, and gitleaks.
jobs:
  quality:
    name: quality
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    name: security
    uses: ./.github/workflows/security.yml
    secrets: inherit
    permissions:
      contents: read
      issues: write
      security-events: write

  cut:
    name: cut
    needs: [quality, security]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Cut or reuse release
        id: cut
        env:
          VERSION: ${{ inputs.version }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          existing="$(sed -n 's/^chore(release): prepare for \(v\?[0-9][0-9.]*\).*/\1/p' <<<"${MESSAGE:-}" | head -1)"
          existing="${existing#v}"

          if [[ -n "$existing" && -z "${VERSION:-}" ]]; then
            tag="$existing"
            if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists — skip publish from this push"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag -a "$tag" -m "$tag"
            git push origin "refs/tags/$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${VERSION:-}" ]]; then
            version="$VERSION"
          else
            version="$(python3 scripts/bump-version.py next)"
          fi
          version="$(tr -d '[:space:]' <<<"$version")"
          version="${version#v}"
          tag="$version"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — nothing to release" >&2
            exit 1
          fi

          python3 scripts/bump-version.py "$version"
          TAG="$tag" python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          tag = os.environ["TAG"].lstrip("v")
          generated = subprocess.check_output(["git-cliff", "--tag", tag], text=True)
          start = generated.find(f"## [{tag}]")
          if start < 0:
              raise SystemExit(f"git-cliff produced no heading for {tag}")
          nxt = generated.find("\n## [", start + 1)
          section = generated[start : nxt if nxt >= 0 else None].rstrip() + "\n\n"
          path = Path("CHANGELOG.md")
          existing = path.read_text()
          body_at = existing.find("## [")
          if body_at < 0:
              raise SystemExit("CHANGELOG.md has no version heading")
          path.write_text(existing[:body_at] + section + existing[body_at:])
          PY
          git add Cargo.toml Cargo.lock config.yaml addon/config.yaml \
            custom_components/klar_nlu/manifest.json \
            custom_components/klar_nlu/const.py CHANGELOG.md
          git commit -m "chore(release): prepare for ${tag}"
          git push origin "HEAD:refs/heads/main"
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: cut
    if: needs.cut.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.cut.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
      security-events: write
