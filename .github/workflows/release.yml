name: Release
# Pin Ubuntu 26.04. ubuntu-latest moves to this image through November 2026.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Empty = next YYYY.M.PATCH (Home Assistant CalVer). Or set 2026.8.0
        type: string
        required: false

concurrency:
  group: release-main
  cancel-in-progress: false

# Nothing by default: every job states its own permissions. For a job that calls a
# reusable workflow those must cover every permission the called jobs declare
# (including skipped ones), otherwise GitHub rejects the run as startup_failure.
permissions: {}

# Tag/publish only after fmt, clippy, nextest, pack freshness, web, audit, deny, and gitleaks.
jobs:
  quality:
    name: quality
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    name: security
    uses: ./.github/workflows/security.yml
    # The repository has no secrets of its own; the callee only reads GITHUB_TOKEN.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    # What the jobs of security.yml declare, taken together.
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

  cut:
    name: cut
    needs: [quality, security]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # scripts/cut-release.sh pushes with this checkout's credentials.
        with: # zizmor: ignore[artipacked]
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: git-cliff

      - name: Cut or reuse release
        id: cut
        env:
          VERSION: ${{ inputs.version }}
          MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/cut-release.sh

  publish:
    name: publish
    needs: cut
    if: needs.cut.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.cut.outputs.tag }}
    # As above. Dropping it is untested on a publishing run, so it stays for now.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: write
      packages: write
      security-events: write

  # V-02: Supervisor reads addon/config.yaml from main. Merge only after images exist.
  land:
    name: land
    needs: [cut, publish]
    if: ${{ always() && needs.cut.outputs.tag != '' && needs.publish.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # scripts/cut-release.sh --land-addon merges with this checkout's credentials.
        with: # zizmor: ignore[artipacked]
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Land add-on version on main
        env:
          TAG: ${{ needs.cut.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/cut-release.sh --land-addon
