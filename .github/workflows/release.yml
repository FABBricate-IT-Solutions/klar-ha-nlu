name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump from conventional commits (auto) or forced
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    name: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          extra=()
          if [[ "$BUMP" != "auto" ]]; then
            extra=(--bump "$BUMP")
          fi
          raw="$(git-cliff --bumped-version "${extra[@]}")"
          raw="$(tr -d '[:space:]' <<<"$raw")"
          if [[ -z "$raw" ]]; then
            echo "git-cliff did not produce a version" >&2
            exit 1
          fi
          tag="$raw"
          [[ "$tag" == v* ]] || tag="v$tag"
          version="${tag#v}"
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists — nothing to release" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump crate and add-on versions
        run: python3 scripts/bump-version.py "${{ steps.ver.outputs.version }}"

      - name: Write CHANGELOG.md
        run: git-cliff --tag "${{ steps.ver.outputs.tag }}" -o CHANGELOG.md

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/${TAG}"
          git checkout -b "$branch"
          git add Cargo.toml config.yaml addon/config.yaml \
            custom_components/klar_nlu/manifest.json CHANGELOG.md
          git commit -m "chore(release): prepare for ${TAG}"
          git push origin HEAD
          gh pr create \
            --title "chore(release): prepare for ${TAG}" \
            --body "Prepares ${TAG}. Auto-merge waits for required checks, then the tag job publishes the GitHub Release."
          gh pr merge --squash --auto --delete-branch

  publish-tag:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
    name: publish-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release tag
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag="$(sed -n 's/^chore(release): prepare for \(v[0-9][0-9.]*\).*/\1/p' <<<"$MESSAGE" | head -1)"
          if [[ -z "$tag" ]]; then
            echo "Commit is not a versioned release prepare" >&2
            exit 0
          fi
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"
