name: Security
# Pin Ubuntu 26.04. ubuntu-latest moves to this image through November 2026.

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

# Read-only by default. codeql and trivy ask for what they need themselves.
permissions:
  contents: read

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.91"
      # Prebuilt binary instead of `cargo install` (that compiled for about three minutes
      # on every run).
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.22.1
      - run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          arguments: --all-features

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The GitHub Action requires an org license; the CLI does not.
      - name: Gitleaks
        run: |
          set -euo pipefail
          version=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --verbose --redact --exit-code 1

  semgrep:
    name: semgrep
    runs-on: ubuntu-26.04
    container:
      # Pinned by digest; raise tag and digest together.
      image: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Default catalog rules
        run: semgrep scan --config .semgrep/klar.yml --error --quiet

  # Weekly/manual only. Skipped on workflow_call so release reuse stays fast.
  codeql:
    name: codeql-rust
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: rust
          build-mode: none
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:rust"

  # Weekly/manual scan of the published multi-arch image. Not on every PR.
  trivy:
    name: trivy-ghcr
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image present
        id: image
        env:
          IMAGE: ghcr.io/fabbricate-it-solutions/klar-nlu:latest
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.image.outputs.present == 'true'
        with:
          version: v0.74.0
          image-ref: ghcr.io/fabbricate-it-solutions/klar-nlu:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always() && steps.image.outputs.present == 'true'
        with:
          sarif_file: trivy-results.sarif
      - name: Skip missing image
        if: steps.image.outputs.present != 'true'
        run: echo "GHCR :latest is not published yet — skip Trivy"
