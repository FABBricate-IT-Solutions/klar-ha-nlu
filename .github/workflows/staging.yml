name: Staging
# Pin Ubuntu 26.04. ubuntu-latest moves to this image through November 2026.

# Merge to protected `staging` (via PR) → quality + security (slim nextest)
# → annotated tag `{CalVer}-staging.{sha7}` → Build as a GitHub prerelease.
# Runs Klar's own dataset suites (job dataset-suites); the multi-locale parity
# rubric stays with language-parity.yml and the `ci` profile on main.
# Does not bump CalVer, does not push to `staging`/`main`, does not tag `latest`.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-prerelease
  cancel-in-progress: false

# Nothing by default: every job states its own permissions. For a job that calls a
# reusable workflow those must cover every permission the called jobs declare
# (including skipped ones), otherwise GitHub rejects the run as startup_failure.
permissions: {}

# V-10: workflow_dispatch can target any branch; only publish from staging.
jobs:
  quality:
    name: quality
    if: github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/ci.yml
    with:
      nextest_profile: ci-staging
    permissions:
      contents: read

  security:
    name: security
    if: github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/security.yml
    # The repository has no secrets of its own; the callee only reads GITHUB_TOKEN.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    # What the jobs of security.yml declare, taken together.
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

  tag:
    name: tag
    if: github.ref == 'refs/heads/staging'
    needs: [quality, security]
    runs-on: ubuntu-26.04
    # Pushes the RC tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The next step pushes the tag with this checkout's credentials.
        with: # zizmor: ignore[artipacked]
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Tag staging RC
        id: tag
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Cargo.toml version is not CalVer: $version" >&2
            exit 1
          fi
          sha7="$(git rev-parse --short=7 HEAD)"
          tag="${version}-staging.${sha7}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — reuse"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "staging RC ${tag}"
            git push origin "refs/tags/${tag}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: tag
    if: github.ref == 'refs/heads/staging' && needs.tag.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.tag.outputs.tag }}
      prerelease: true
    # As above. Dropping it is untested on a publishing run, so it stays for now.
    secrets: inherit # zizmor: ignore[secrets-inherit]
    permissions:
      contents: write
      packages: write
      security-events: write
