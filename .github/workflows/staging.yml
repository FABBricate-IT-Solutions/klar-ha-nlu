name: Staging

# Merge to protected `staging` (via PR) → quality + security (same as Release)
# → annotated tag `{CalVer}-staging.{sha7}` → Build as a GitHub prerelease.
# Does not bump CalVer, does not push to `staging`/`main`, does not tag `latest`.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-prerelease
  cancel-in-progress: false

# Must cover every permission callee jobs declare (including skipped ones).
# Otherwise GitHub rejects the run as startup_failure before any job starts.
permissions:
  actions: read
  contents: write
  issues: write
  packages: write
  security-events: write

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    name: security
    uses: ./.github/workflows/security.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      security-events: write

  tag:
    name: tag
    needs: [quality, security]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Tag staging RC
        id: tag
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Cargo.toml version is not CalVer: $version" >&2
            exit 1
          fi
          sha7="$(git rev-parse --short=7 HEAD)"
          tag="${version}-staging.${sha7}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — reuse"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "staging RC ${tag}"
            git push origin "refs/tags/${tag}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  publish:
    name: publish
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.tag.outputs.tag }}
      prerelease: true
    secrets: inherit
    permissions:
      contents: write
      packages: write
      security-events: write
