name: Validate
# Pin Ubuntu 26.04. ubuntu-latest moves to this image through November 2026.

on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: hacs
    runs-on: ubuntu-26.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration
