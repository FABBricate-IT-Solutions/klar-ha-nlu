# Local-dev only. CI already runs rustfmt, check_lang_packs, and gitleaks.
# Do not add a pre-commit CI job. Do not run nextest or generate.py here.
repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]
      - id: check-lang-packs
        name: check_lang_packs
        entry: python3 scripts/check_lang_packs.py
        language: system
        pass_filenames: false
        files: ^(src/lang/|src/parse/|src/types/settings\.rs|custom_components/klar_nlu/|scripts/check_lang_packs\.py)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
