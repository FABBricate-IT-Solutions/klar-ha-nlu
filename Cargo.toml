[package]
name = "klar-nlu"
version = "2026.11.3"
edition = "2021"
rust-version = "1.85"
description = "Deterministic NLU for Home Assistant — 67 languages, Assist alternative"
license = "MIT"
default-run = "klar"

[[bin]]
name = "klar"
path = "src/main.rs"

[[bin]]
name = "export_web_contract"
path = "src/bin/export_web_contract.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
# The HTTP listener drives hyper itself, for the request-head deadline and the connection
# cap that `axum::serve` does not have. All three are already in the tree through axum.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tower = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# url 2.5.9 fixes RUSTSEC-2026-0592. idna 1.1.0 still uses idna_adapter;
# pin adapter 1.1 so rustc 1.85 does not pull ICU4X (adapter 1.2 needs 1.86).
url = "=2.5.9"
idna = "=1.1.0"
idna_adapter = "=1.1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
strsim = "0.11"
# uuid 1.27 sets rust-version 1.89. Stay on 1.26.x for the 1.85 toolchain.
uuid = { version = ">=1, <1.27", features = ["v4"] }
serde_yaml = "0.9"
tower-http = { version = "0.7.0", features = ["fs", "timeout", "compression-gzip", "set-header"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }

[dev-dependencies]
# Scratch directories for tests; removed on drop, also when a test panics.
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.test]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
