[package]
name = "klar-nlu"
version = "2026.11.3"
edition = "2021"
rust-version = "1.91"
description = "Deterministic NLU for Home Assistant — 67 languages, Assist alternative"
license = "MIT"
default-run = "klar"

[[bin]]
name = "klar"
path = "src/main.rs"

[[bin]]
name = "export_web_contract"
path = "src/bin/export_web_contract.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
# The HTTP listener drives hyper itself, for the request-head deadline and the connection
# cap that `axum::serve` does not have. All three are already in the tree through axum.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tower = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2.5.9"
idna = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
strsim = "0.11"
uuid = { version = "1", features = ["v4"] }
# Maintained serde_yaml fork (drops unmaintained unsafe-libyaml). Keep the serde_yaml
# import path so call sites stay stable (V-14).
serde_yaml = { package = "serde_norway", version = "0.9" }
tower-http = { version = "0.7.0", features = ["fs", "timeout", "compression-gzip", "set-header"] }
# default-features pulls xattr → rustix; we only need plain ustar for settings backup.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
parking_lot = "0.12"
unicode-normalization = "0.1"

[dev-dependencies]
# Scratch directories for tests; removed on drop, also when a test panics.
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.test]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
