[advisories]
version = 2
yanked = "deny"
ignore = [
    # serde_yaml 0.9 is frozen on unsafe-libyaml. RUSTSEC-2024-0449 marks that
    # parser unmaintained; there is no patched release. It parses local config
    # and test YAML, and cargo-audit does not treat this as a vulnerability.
    { id = "RUSTSEC-2024-0449", reason = "serde_yaml 0.9 has no release that drops unmaintained unsafe-libyaml" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
