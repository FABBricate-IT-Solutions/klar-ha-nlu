- name: light_on
  sentences:
    - включи светлина хол
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - изключи светлина кухня
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - какво има в календара
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - добавя зъболекар утре в 15 календар
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - изтрий зъболекар календар
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - премести зъболекар утре в 16 календар
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - пусни depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
