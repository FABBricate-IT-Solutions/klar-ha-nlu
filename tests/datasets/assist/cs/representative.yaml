- name: light_on
  sentences:
    - zapni svetlo obyvak
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - vypni svetlo kuchyne
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - co je v kalendari
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - pridej zubare zitra v 15 kalendar
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - smaz zubare kalendar
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - presun zubare zitra v 16 kalendar
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - play depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
