- name: light_on
  sentences:
    - turn on the lounge light
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - switch off the kitchen light
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - whats on my calendar
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - add dentist tomorrow at 3 to my calendar
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - delete dentist calendar
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - move dentist tomorrow at 4 calendar
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - play depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
