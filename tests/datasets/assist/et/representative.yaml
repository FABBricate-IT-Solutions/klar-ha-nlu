- name: light_on
  sentences:
    - lulita vali elutuba
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - kustuta vali kook
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - mis on kalendris
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - lisa hambaarst homme kell 15 kalender
