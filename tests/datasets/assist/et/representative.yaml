    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - liiguta hambaarst homme kell 16 kalender
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - mangi depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
