- name: light_on
  sentences:
    - sytyta valo olohuone
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - sammuta valo keittio
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - mita kalenterissa
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - lisaa hammaslaakari huomenna klo 15 kalenteri
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - poista hammaslaakari kalenteri
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - siirra hammaslaakari huomenna klo 16 kalenteri
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - soita depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
