- name: light_on
  sentences:
    - upali svjetlo dnevni
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - ugasi svjetlo kuhinja
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - sto je u kalendaru
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - dodaj zubara sutra u 15 kalendar
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - obrisi zubara kalendar
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - premjesti zubara sutra u 16 kalendar
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - pokreni depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
