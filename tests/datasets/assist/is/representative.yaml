    - kveiktu ljos stofa
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - slokktu ljos eldhus
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
