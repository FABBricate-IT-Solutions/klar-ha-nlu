- name: light_on
  sentences:
    - iesledz gaisma istaba
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - izsledz gaisma virtuve
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - kas ir kalendara
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - pievieno zobarstu rit 15 kalendars
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - dzes zobarstu kalendars
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - parvietot zobarstu rit 16 kalendars
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - atskanot depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
