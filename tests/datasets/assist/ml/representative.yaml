- name: light_on
  sentences:
    - theli vilakku muriyil
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - anaykku vilakku adukkala
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - calendar il enthu
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - chertu dentist nale 15 calendar
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - maattu dentist calendar
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - nivarthu dentist nale 16 calendar
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - okke depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
