- name: light_on
  sentences:
    - zet het licht woonkamer aan
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - zet het licht keuken uit
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - wat staat in de agenda
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - voeg tandarts morgen om 15 kalender
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - verwijder tandarts kalender
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - verplaats tandarts morgen om 16 kalender
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - speel depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
