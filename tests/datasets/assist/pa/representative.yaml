- name: light_on
  sentences:
    - ਚਾਲੂ ਰੋਸ਼ਨੀ ਬੈਠਕ
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - ਬੰਦ ਰੋਸ਼ਨੀ ਰਸੋਈ
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - ਕੈਲੰਡਰ ਵਿਚ ਕੀ
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - ਪਾਓ ਦੰਦ ਕੱਲ 15 ਕੈਲੰਡਰ
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - ਹਟਾਓ ਦੰਦ ਕੈਲੰਡਰ
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - ਸਰਕਾ ਦੰਦ ਕੱਲ 16 ਕੈਲੰਡਰ
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - ਚਲਾਓ depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
