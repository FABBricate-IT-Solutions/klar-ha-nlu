      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - przenies dentyste jutro o 16 kalendarz
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - odtworz depeche
  nlu_expect:
