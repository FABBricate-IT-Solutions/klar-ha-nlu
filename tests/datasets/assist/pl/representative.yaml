- name: light_on
  sentences:
    - wlacz swiatlo salon
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - wylacz swiatlo kuchnia
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - co jest w kalendarzu
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
