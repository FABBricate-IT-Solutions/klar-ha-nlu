- name: light_on
  sentences:
    - zapni svetlo obyvacka
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - vypni svetlo kuchyne
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - co je v kalendari
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - pridaj zubara zajtra o 15 kalendar
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - zmaz zubara kalendar
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - presun zubara zajtra o 16 kalendar
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - pust depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
