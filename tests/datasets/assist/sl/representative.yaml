- name: light_on
  sentences:
    - prizgi luc dnevna
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - ugasni luc kuhinja
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - kaj je v koledarju
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - dodaj zobozdravnika jutri ob 15 koledar
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - izbrisi zobozdravnika koledar
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - premakni zobozdravnika jutri ob 16 koledar
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - predvajaj depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
