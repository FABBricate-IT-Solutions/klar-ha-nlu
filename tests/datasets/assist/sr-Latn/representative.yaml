- name: light_on
  sentences:
    - ukljuci svetlo dnevna
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - iskljuci svetlo kuhinja
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - sta je u kalendaru
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - dodaj zubara sutra u 15 kalendar
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - obrisi zubara kalendar
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - premesti zubara sutra u 16 kalendar
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - pusti depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
