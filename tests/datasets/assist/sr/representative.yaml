- name: light_on
  sentences:
    - укључи светло дневна
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - искључи светло кухиња
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - шта је у календару
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - додај зубара сутра у 15 календар
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - обриши зубара календар
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - премести зубара сутра у 16 календар
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - пусти depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
