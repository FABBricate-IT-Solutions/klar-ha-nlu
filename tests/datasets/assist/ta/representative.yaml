- name: light_on
  sentences:
    - eru vilakku arai
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - anai vilakku samaiyal
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - calendar la enna
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - seru dentist naalai 15 calendar
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - neekku dentist calendar
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - maatru dentist naalai 16 calendar
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - valu depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
