- name: light_on
  sentences:
    - వెలిగించు వెలుగు గది
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - ఆర్పు వెలుగు వంటగది
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
