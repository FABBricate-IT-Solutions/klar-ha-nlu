      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - ลบ หมอ ปฏิทิน
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - ย้าย หมอ พรุ่งนี้ 16 ปฏิทิน
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - เล่น depeche
  nlu_expect:
