- name: light_on
  sentences:
    - เปิด ไฟ ห้องนั่งเล่น
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - ปิด ไฟ ห้องครัว
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - ปฏิทิน มีอะไร
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - เพิ่ม หมอ พรุ่งนี้ 15 ปฏิทิน
  nlu_expect:
