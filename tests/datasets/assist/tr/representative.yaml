- name: light_on
  sentences:
    - yak isik salon
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - sondur isik mutfak
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - takvimde ne var
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - ekle disci yarin saat 15 takvim
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - sil disci takvim
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - tasi disci yarin saat 16 takvim
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - oynat depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
