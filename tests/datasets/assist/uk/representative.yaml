- name: light_on
  sentences:
    - увімкни світло вітальня
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - вимкни світло кухня
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - що в календарі
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - додай стоматолога завтра о 15 календар
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - видали стоматолога календар
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - перенеси стоматолога завтра о 16 календар
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - грай depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
