- name: light_on
  sentences:
    - چالو روشنی لانج
  nlu_expect:
    intents:
      - intent: HassTurnOn
- name: light_off
  sentences:
    - بند روشنی باورچی
  nlu_expect:
    intents:
      - intent: HassTurnOff
- name: calendar_list
  sentences:
    - کیلنڈر میں کیا ہے
  nlu_expect:
    intents:
      - intent: KlarGetCalendarEvents
- name: calendar_create
  sentences:
    - شامل دانت کل 15 کیلنڈر
  nlu_expect:
    intents:
      - intent: KlarCreateCalendarEvent
- name: calendar_delete
  sentences:
    - حذف دانت کیلنڈر
  nlu_expect:
    intents:
      - intent: KlarDeleteCalendarEvent
- name: calendar_move
  sentences:
    - منتقل دانت کل 16 کیلنڈر
  nlu_expect:
    intents:
      - intent: KlarMoveCalendarEvent
- name: play_media
  sentences:
    - چلاو depeche
  nlu_expect:
    intents:
      - intent: MassPlayMedia
