scenes:
- id: movie_night
  name: Filmabend
  entities:
    light.living_ceiling:
      state: 'off'
    light.living_lamp:
      state: 'on'
      brightness: 20
    media_player.living_tv:
      state: 'on'
    cover.living_blinds:
      state: closed
- id: dinner_time
  name: Abendessen
  entities:
    light.dining_pendant:
      state: 'on'
      brightness: 90
    light.kitchen_ceiling:
      state: 'on'
    light.kitchen_island:
      state: 'on'
      brightness: 80
- id: kids_bedtime
  name: Kinder ins Bett
  entities:
    light.bedroom2_ceiling:
      state: 'off'
    light.bedroom3_ceiling:
      state: 'off'
    light.bedroom4_ceiling:
      state: 'off'
    light.hallway_light:
      state: 'on'
      brightness: 15
- id: good_morning
  name: Guten Morgen
  entities:
    light.kitchen_ceiling:
      state: 'on'
    light.dining_pendant:
      state: 'on'
      brightness: 100
    cover.living_blinds:
      state: open
    cover.master_blinds:
      state: open
scripts:
- id: good_night
  name: Gute Nacht
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.living_ceiling
      - light.living_lamp
      - light.dining_pendant
      - light.kitchen_ceiling
      - light.kitchen_island
      - light.family_ceiling
      - light.entryway_light
      - light.hallway_light
  - action: lock.lock
    target:
      entity_id:
      - lock.front_door
      - lock.garage_entry
  - action: climate.set_temperature
    target:
      entity_id: climate.upper_thermostat
    data:
      temperature: 20
- id: leaving_home
  name: Haus verlassen
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.living_ceiling
      - light.living_lamp
      - light.kitchen_ceiling
      - light.family_ceiling
      - light.entryway_light
  - action: lock.lock
    target:
      entity_id:
      - lock.front_door
      - lock.garage_entry
  - action: cover.close_cover
    target:
      entity_id: cover.garage_door
timers:
- id: oven
  name: Ofen-Timer
  state: idle
- id: laundry
  name: Wäsche-Timer
  state: idle
- id: abstract
  name: Timer
  state: idle
lists:
- id: chores
  name: Aufgaben
language: de
