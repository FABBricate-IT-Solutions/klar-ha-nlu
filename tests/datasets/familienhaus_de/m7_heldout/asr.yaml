- name: asr_eingang
  split: asr
  language: de
  sentences:
    - 'Mach Eingangslich an'
    - 'Mach das Einganslicht an'
  nlu_expect:
    intents:
      - intent: HassTurnOn
        slots: {entity_id: light.entryway_light}

