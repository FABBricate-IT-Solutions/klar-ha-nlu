- name: spoken_except_kitchen
  conditions:
    - {type: action, area: living, domain: light, state: 'off'}
    - {type: action, area: dining, domain: light, state: 'off'}
    - {type: action, area: family_room, domain: light, state: 'off'}
    - {type: action, area: garage, domain: light, state: 'off'}
    - {type: action, area: hallway, domain: light, state: 'off'}
    - {type: action, area: master_bedroom, domain: light, state: 'off'}
    - {type: action, area: bedroom_2, domain: light, state: 'off'}
    - {type: action, area: entryway, domain: light, state: 'off'}
  forbid:
    - kitchen
    - light.kitchen_ceiling
    - light.kitchen_island
  sentences:
