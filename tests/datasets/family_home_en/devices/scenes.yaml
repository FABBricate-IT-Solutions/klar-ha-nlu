-
  name: movie_night
  conditions:
    -
      type: action
      entity_id: light.living_ceiling
      state: 'off'
    -
      type: action
      entity_id: light.living_lamp
      state: 'on'
      attributes:
        brightness: 20
    -
      type: action
      entity_id: media_player.living_tv
      state: 'on'
    -
      type: action
      entity_id: cover.living_blinds
      state: closed
  sentences:
    - 'Turn on the Movie Night scene'
    - 'Flick on movie night scene'
    - 'Flip on the Movie Night scene in ~area~'
    - 'Please start the Movie Night scene for me'
    - "If you don't mind, activate movie night scene"
    - 'Quickly turn on movie night scene'
    - 'Engage the Movie Night scene now'
-
  name: dinner_time
  conditions:
    -
      type: action
      entity_id: light.dining_pendant
      state: 'on'
      attributes:
        brightness: 90
    -
      type: action
      entity_id: light.kitchen_ceiling
      state: 'on'
    -
      type: action
      entity_id: light.kitchen_island
      state: 'on'
      attributes:
        brightness: 80
  sentences:
    - 'Turn on the Dinner Time scene'
    - 'Flick on dinner time scene'
    - 'Please activate dinner time scene for me'
    - "If you don't mind, flip on the Dinner Time scene in ~area~"
    - 'Activate dinner time scene'
    - 'Quickly turn on dinner time scene'
    - 'Can you start the dinner time scene please'
