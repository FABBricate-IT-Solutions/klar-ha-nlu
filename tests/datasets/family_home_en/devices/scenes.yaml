-
  name: good_morning
  conditions:
    -
      type: action
      entity_id: light.kitchen_ceiling
      state: 'on'
    -
      type: action
      entity_id: light.dining_pendant
      state: 'on'
      attributes:
        brightness: 100
    -
      type: action
      entity_id: cover.living_blinds
      state: open
    -
      type: action
      entity_id: cover.master_blinds
      state: open
  sentences:
    - 'Turn on the Good Morning scene'
    - 'Flip on good morning scene'
    - 'Please activate the Good Morning scene for me'
    - "If you don't mind, flick on the Good Morning scene"
    - 'Activate good morning scene in the ~area~'
    - 'Quickly turn on good morning scene'
    - 'Could you enable the Good Morning scene please'
