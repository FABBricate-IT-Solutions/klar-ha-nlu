-
  name: shopping_list_add_apples
  sentences:
    - 'Add apples to the shopping list'
    - 'Please put some apples on my list'
    - "Stick apples on the shopping list if you don't mind"
    - 'Place apples on the list please'
    - 'Put apples on the shopping list'
    - 'Could you add apples to my list'
  nlu_expect:
    intents:
      - intent: HassListAddItem
        slots: {name: shopping_list, item: apples}
  world_expect:
    - shopping_list_item: apples
-
  name: shopping_list_complete_bread
  setup:
    -
      shopping_list_item: bread
    -
      shopping_list_item: butter
    -
      shopping_list_item: milk
    -
      shopping_list_item: chicken
    -
      shopping_list_item: bananas
  sentences:
    - 'mark bread as done on the shopping list'
    - 'put bread on the done list'
    - 'please mark bread as done for me'
    - "if you don't mind, stick bread on the completed list"
    - 'place bread as finished on the shopping list'
    - 'mark bread as done'
    - 'put bread on the done list please'
    - 'tick bread off the shopping list'
    - 'cross bread off the shopping list'
    - 'check off bread on the shopping list'
  nlu_expect:
    intents:
      - intent: HassListCompleteItem
        slots: {name: shopping_list, item: bread}
  world_expect:
    - shopping_list_completed_item: bread
    - shopping_list_item: butter
-
  name: shopping_list_remove_milk
  setup:
    -
      shopping_list_item: bread
    -
      shopping_list_item: milk
  sentences:
    - 'Remove milk from the shopping list'
    - 'Delete milk from the shopping list'
    - 'Take milk off the shopping list'
    - 'Remove milk from my list'
    - 'Erase milk from the shopping list'
    - "please take milk off the list if you don't mind"
  nlu_expect:
    intents:
      - intent: HassListRemoveItem
        slots: {name: shopping_list, item: milk}
  world_expect:
    - shopping_list_item: bread
-
  name: chores_add_wipe_down_the_counte
  sentences:
    - 'Add wipe down the counters to the Chores list'
    - 'Put wipe down the counters on Chores'
    - 'Please add wipe down the counters to Chores for me'
    - "Stick wipe down the counters on the Chores list if you don't mind"
    - 'Place wipe down the counters in Chores'
    - 'Quickly add wipe down the counters to Chores'
    - 'Could you put wipe down the counters on the Chores list please'
  nlu_expect:
    intents:
      - intent: HassListAddItem
        slots: {entity_id: todo.chores, item: wipe down counters}
-
