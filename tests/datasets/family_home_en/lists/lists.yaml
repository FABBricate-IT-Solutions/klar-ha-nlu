-
  name: chores_remove_mop_the_kitchen_floo
  sentences:
    - 'remove mop the kitchen floor from the Chores list'
    - 'take mop the kitchen floor off the Chores list'
    - 'please delete mop the kitchen floor from the Chores list for me'
    - "if you don't mind, remove mop the kitchen floor from the Chores list"
    - 'erase mop the kitchen floor from the Chores list'
    - 'take mop the kitchen floor off the Chores list please'
    - "delete mop the kitchen floor from the Chores list if you don't mind"
  nlu_expect:
    intents:
      - intent: HassListRemoveItem
        slots: {entity_id: todo.chores, item: mop kitchen floor}
