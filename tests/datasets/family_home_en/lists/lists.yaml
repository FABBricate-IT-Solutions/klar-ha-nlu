    - "If you don't mind, mark scrub the toilet as done on the Chores list"
    - 'Put scrub the toilet as done on the Chores list'
    - 'Stick scrub the toilet as done on the Chores list'
    - 'Place scrub the toilet as done on the Chores list'
    - 'Mark scrub the toilet as complete on the Chores list'
  nlu_expect:
