-
  name: entryway_locks_get_state
  conditions:
    -
      type: query
      area: entryway
      domain: lock
  sentences:
    - "What's the status of the entryway locks?"
    - 'Check entryway locks'
    - 'Please tell me if the entryway is locked'
    - "If you don't mind, what's the lock status for the entryway?"
    - 'Entryway locks state'
    - 'Could you check the locks in the entryway for me?'
    - 'Are the entryway locks locked or unlocked?'
