      entity_id: lock.garage_entry
      state: locked
  conditions:
    -
      type: action
      entity_id: lock.garage_entry
      state: unlocked
  sentences:
    -
      - "What's the status of the garage entry door?"
      - 'Unlock it please.'
    -
      - 'Can you tell me if the garage entry door is locked?'
      - 'Go ahead and unlock it for me.'
    -
      - 'Garage entry door state?'
      - 'Flick it open.'
    -
      - 'Is the garage entry door locked right now?'
      - "If you don't mind, unlock it."
