- name: vacuum_start
  conditions:
  - type: action
    entity_id: vacuum.robot
    state: 'on'
  sentences:
  - taend stoevsuger
  - stoevsuger taend
- name: vacuum_dock
  conditions:
  - type: action
    entity_id: vacuum.robot
    state: 'off'
  sentences:
  - sluk stoevsuger
  - stoevsuger sluk
