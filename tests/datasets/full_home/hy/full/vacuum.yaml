- name: vacuum_start
  conditions:
  - type: action
    entity_id: vacuum.robot
    state: 'on'
  sentences:
  - միացրու փոշեկուլ
  - փոշեկուլ միացրու
- name: vacuum_dock
  conditions:
  - type: action
    entity_id: vacuum.robot
    state: 'off'
  sentences:
  - անջատիր փոշեկուլ
  - փոշեկուլ անջատիր
