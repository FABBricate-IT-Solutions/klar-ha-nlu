# Gold natural sentences for ka: hand-written, not generated from the pack lexicon.
# Hand-authored natural speech (Q-02); not speaker-verified.
rooms:
  living: "მისაღები"
  kitchen: "სამზარეულო"
  bedroom: "საძინებელი"
  hall: "დერეფანი"
devices:
  light_living: "მისაღების შუქი"
  light_kitchen: "სამზარეულოს შუქი"
  light_bedroom: "საძინებლის შუქი"
  cover_bedroom: "საძინებლის ფარდები"
  climate_living: "გათბობა"
  lock_front: "შესასვლელი კარი"
  shopping_list: "საყიდლების სია"
cases:
  - text: "ჩართე შუქი მისაღებში"
    expect: "TurnOn@living"
    kind: execute
  - text: "გამორთე შუქი სამზარეულოში"
    expect: "TurnOff@kitchen"
    kind: execute
  - text: "აანთე შუქი მისაღებში"
    expect: "TurnOn@living"
    kind: execute
    soft: "known gap: asks a follow-up instead of acting"
  - text: "დააყენე შუქი მისაღებში 50 პროცენტზე"
    expect: "LightSet@living:brightness=50"
    kind: execute
  - text: "დააყენე გათბობა 21 გრადუსზე"
    expect: "ClimateSetTemperature:temperature=21"
    kind: execute
  - text: "გააღე საძინებლის ფარდები"
    expect: "TurnOn@bedroom"
    kind: execute
  - text: "დახურე საძინებლის ფარდები"
    expect: "CONFIRM"
    kind: confirm
  - text: "ჩართულია შუქი სამზარეულოში?"
    expect: "GetState@kitchen"
    kind: execute
    soft: "known gap: asks a follow-up instead of acting"
  - text: "რა ტემპერატურაა მისაღებში?"
    expect: "GetTemp@living"
    kind: execute
  - text: "დააყენე ტაიმერი ხუთი წუთით"
    expect: "StartTimer:minutes=5"
    kind: execute
    soft: "known gap: asks a follow-up instead of acting"
  - text: "დაამატე რძე საყიდლების სიაში"
    expect: "ListAdd:item=რძე"
    kind: execute
  - text: "დააპაუზე მუსიკა"
    expect: "MediaPause"
    kind: execute
  - text: "ჩაკეტე შესასვლელი კარი"
    expect: "CONFIRM"
    kind: confirm
  - text: "რომელი საათია?"
    expect: "CHAT"
    kind: chat
