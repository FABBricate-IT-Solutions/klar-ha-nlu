# Gold natural sentences for pt-BR: hand-written, not generated from the pack lexicon.
# source: plan evidence natural.py (Q-02)
rooms:
  living: "Sala"
  kitchen: "Cozinha"
  bedroom: "Quarto"
  hall: "Entrada"
devices:
  light_living: "Luz da sala"
  light_kitchen: "Luz da cozinha"
  light_bedroom: "Luz do quarto"
  cover_bedroom: "Persianas do quarto"
  climate_living: "Aquecedor"
  lock_front: "Porta da frente"
  shopping_list: "Lista de compras"
cases:
  - text: "Acende a luz da sala"
    expect: "TurnOn@living"
    kind: execute
  - text: "Apaga a luz da cozinha"
    expect: "TurnOff@kitchen"
    kind: execute
  - text: "Liga a luz da sala"
    expect: "TurnOn@living"
    kind: execute
  - text: "Desliga a luz da cozinha"
    expect: "TurnOff@kitchen"
    kind: execute
  - text: "Coloca a luz da sala em 50 por cento"
    expect: "LightSet@living:brightness=50"
    kind: execute
  - text: "Coloca o aquecedor em 21 graus"
    expect: "ClimateSetTemperature:temperature=21"
    kind: execute
  - text: "Abre as persianas do quarto"
    expect: "TurnOn@bedroom"
    kind: execute
  - text: "Fecha as persianas do quarto"
    expect: "CONFIRM"
    kind: confirm
  - text: "A luz da cozinha está ligada?"
    expect: "GetState@kitchen"
    kind: execute
  - text: "Qual é a temperatura da sala?"
    expect: "GetTemp@living"
    kind: execute
  - text: "Coloca um timer de cinco minutos"
    expect: "StartTimer:minutes=5"
    kind: execute
    soft: "known gap: rejected (NoAction)"
  - text: "Adiciona leite na lista de compras"
    expect: "ListAdd:item=leite"
    kind: execute
  - text: "Pausa a música"
    expect: "MediaPause"
    kind: execute
  - text: "Tranca a porta da frente"
    expect: "CONFIRM"
    kind: confirm
  - text: "Que horas são?"
    expect: "CHAT"
    kind: chat
