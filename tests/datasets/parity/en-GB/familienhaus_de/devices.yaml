devices/scenes::dinner_time:
- set light loungefamess 90 then enable ceiling kitchen then set island kitchen 80
devices/scenes::good_morning:
- enable ceiling kitchen then set light loungefamess 100 then open curtain lounge
  then open curtain bedroommaster
devices/scenes::kids_bedtime:
- extinguish ceiling bedroom2 then extinguish ceiling bedroom3 then extinguish ceiling
  bedroom4 then set light porchgang 15
devices/scenes::movie_night:
- extinguish ceiling lounge then set bulb lounge 20 then enable telly lounge then
  close curtain lounge
devices/scripts::good_night:
- extinguish ceiling lounge then extinguish bulb lounge then extinguish light loungefamess
  then extinguish ceiling kitchen then extinguish island kitchen then extinguish ceiling
  loungefam then extinguish light porch then extinguish light porchgang then lock
  lock porch then lock lock garage then set heating bedroommaster 20
devices/scripts::leaving_home:
- extinguish ceiling lounge then extinguish bulb lounge then extinguish ceiling kitchen
  then extinguish ceiling loungefam then extinguish light porch then lock lock porch
  then lock lock garage then close curtain garage
