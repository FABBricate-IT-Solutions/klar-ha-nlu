devices/scenes::dinner_time:
- 设置 灯 jiatingfangess 90 then 打开 tianhuaban 厨房 then 设置 daotai 厨房 80
devices/scenes::good_morning:
- 打开 tianhuaban 厨房 then 设置 灯 jiatingfangess 100 then 开启 帘子 客厅 then 开启 帘子 woshimaster
devices/scenes::kids_bedtime:
- 关闭 tianhuaban woshi2 then 关闭 tianhuaban woshi3 then 关闭 tianhuaban woshi4 then 设置
  灯 xuanguangang 15
devices/scenes::movie_night:
- 关闭 tianhuaban 客厅 then 设置 deng 客厅 20 then 打开 dianshi 客厅 then 合上 帘子 客厅
devices/scripts::good_night:
- 关闭 tianhuaban 客厅 then 关闭 deng 客厅 then 关闭 灯 jiatingfangess then 关闭 tianhuaban 厨房
  then 关闭 daotai 厨房 then 关闭 tianhuaban jiatingfang then 关闭 灯 xuanguan then 关闭 灯 xuanguangang
  then 锁 锁 xuanguan then 锁 锁 garage then 设置 空调 woshimaster 20
devices/scripts::leaving_home:
- 关闭 tianhuaban 客厅 then 关闭 deng 客厅 then 关闭 tianhuaban 厨房 then 关闭 tianhuaban jiatingfang
  then 关闭 灯 xuanguan then 锁 锁 xuanguan then 锁 锁 garage then 合上 帘子 garage
