devices/scenes::good_morning:
- 打開 tianhuaban 廚房 then 設置 燈 jiatingfangess 100 then 開啟 簾子 客廳 then 開啟 簾子 woshimaster
devices/scenes::kids_bedtime:
- 關閉 tianhuaban woshi2 then 關閉 tianhuaban woshi3 then 關閉 tianhuaban woshi4 then 設置
  燈 xuanguangang 15
devices/scenes::movie_night:
- 關閉 tianhuaban 客廳 then 設置 deng 客廳 20 then 打開 電視 客廳 then 合上 簾子 客廳
devices/scripts::good_night:
- 關閉 tianhuaban 客廳 then 關閉 deng 客廳 then 關閉 燈 jiatingfangess then 關閉 tianhuaban 廚房
  then 關閉 daotai 廚房 then 關閉 tianhuaban jiatingfang then 關閉 燈 xuanguan then 關閉 燈 xuanguangang
  then 鎖 鎖 xuanguan then 鎖 鎖 garage then 設置 空調 woshimaster 20
devices/scripts::leaving_home:
- 關閉 tianhuaban 客廳 then 關閉 deng 客廳 then 關閉 tianhuaban 廚房 then 關閉 tianhuaban jiatingfang
  then 關閉 燈 xuanguan then 鎖 鎖 xuanguan then 鎖 鎖 garage then 合上 簾子 garage
