- name: ha_status_kueche
  conditions:
    - {type: query, area: kuche, domain: light}
  forbid:
    - light.alle_lichter
  sentences:
    - 'What is the status of the kitchen'
    - 'Kitchen light status'

- name: ha_status_lichter
  conditions:
    - {type: query, entity_id: light.alle_lichter}
