- name: tv_not_light
  world_expect:
    - {entity_id: media_player.wohnzimmer_tv, state: 'on'}
  sentences:
    - Turn on the living room TV.
    - Living room TV
  nlu_expect:
    intents:
      - intent: HassTurnOn
        slots: {entity_id: media_player.wohnzimmer_tv}
    reject: false
    clarify: false
  forbid:
    - light.wohnzimmer
    - switch.schlafzimmer_tv
  speech_forbids:
    - The light in the living room is on
    - living room light is on

- name: music_play_in_room
  sentences:
    - Play music in the kitchen.
    - Music in the kitchen
  nlu_expect:
    intents:
      - intent: HassMediaUnpause
        slots: {entity_id: media_player.kuchenbereich}
    reject: false
    clarify: false
  speech_forbids:
    - satellite
    - media_player.

- name: music_artist_then_now_playing
  sentences:
    - - Play Queen in the kitchen
      - what's playing
  nlu_expect:
    intents:
      - intent: HassGetState
        slots: {entity_id: media_player.kuchenbereich, media_status: now_playing}
    reject: false
    clarify: false
  speech_forbids:
    - satellite1
    - media_player.

- name: volume_down
  sentences:
    - Turn the volume down a bit
    - Make the music quieter
  nlu_expect:
    intents:
      - intent: HassSetVolumeRelative
        slots: {entity_id: media_player.wohnzimmer, volume_step: down}
    reject: false
    clarify: false
  speech_forbids:
    - what seems to be the issue
    - satellite

- name: next_and_pause
  sentences:
    - - Play music in the kitchen
      - next track
      - pause
  nlu_expect:
    intents:
      - intent: HassMediaPause
        slots: {entity_id: media_player.kuchenbereich}
    reject: false
    clarify: false
  speech_forbids:
    - media_player.
    - satellite
    - kuchenbereich
