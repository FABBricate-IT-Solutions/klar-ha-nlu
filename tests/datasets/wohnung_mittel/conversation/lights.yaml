- name: brightness_percent
  world_expect:
    - {entity_id: light.wohnzimmer, brightness: 30}
  sentences:
    - Wohnzimmer Licht auf 30 Prozent
    - Stell das Licht im Wohnzimmer auf 30 Prozent
  nlu_expect:
    intents:
      - intent: HassLightSet
        slots: {entity_id: light.wohnzimmer, brightness: 30}
    reject: false
    clarify: false
  speech_forbids:
    - nicht geklappt
    - what seems to be the issue

