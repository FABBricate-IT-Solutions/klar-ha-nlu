- name: which_lights_on
  sentences:
    - - Licht im Wohnzimmer an
      - Licht in der Küche an
      - Welche Lichter sind an?
  nlu_expect:
    intents:
      - intent: HassGetState
        slots: {area: wohnzimmer, domain: light}
      - intent: HassGetState
        slots: {area: kuche, domain: light}
    reject: false
    clarify: false
  speech_has:
    - wohnzimmer
    - küche

- name: ambiguous_light
  sentences:
    - Mach das Licht an.
  nlu_expect:
    intents: []
    clarify: true
    reject: false
  speech_has:
    - '?'
