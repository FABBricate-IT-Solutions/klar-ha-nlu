<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klar NLU</title>
  <style>
    :root {
      --bg: #14110e;
      --surface: #1c1916;
      --line: #2a241e;
      --text: #ece7dc;
      --muted: #9a9083;
      --accent: #c45c26;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 "IBM Plex Sans", "Noto Sans", sans-serif;
    }
    header {
      height: 52px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 24px;
    }
    header strong { font-weight: 650; letter-spacing: -0.02em; }
    nav { display: flex; gap: 16px; }
    nav button {
      background: none;
      border: 0;
      color: var(--muted);
      padding: 0;
      font: inherit;
      cursor: pointer;
    }
    nav button.active { color: var(--text); }
    main { max-width: 920px; margin: 0 auto; padding: 24px; }
    textarea, input, select {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }
    textarea { min-height: 88px; resize: vertical; }
    button.act {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
    }
    pre {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
      white-space: pre-wrap;
    }
    label { display: block; margin: 16px 0 6px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
    .hidden { display: none; }
    .hint { color: var(--muted); max-width: 42em; margin: 0 0 16px; }
    .pool, .well {
      min-height: 56px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
    }
    .pool { margin-bottom: 20px; background: #181410; }
    .well.over, .pool.over { border-color: var(--accent); }
    .room {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 12px;
      margin-bottom: 10px;
      align-items: start;
    }
    .room h3 { margin: 6px 0 0; font-size: 14px; font-weight: 600; }
    .chip {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      width: 200px;
      cursor: grab;
    }
    .chip:active { cursor: grabbing; }
    .chip small { display: block; color: var(--muted); font-size: 11px; word-break: break-all; }
    .chip input { margin-top: 6px; padding: 4px 6px; font-size: 13px; }
    .chip .pin {
      float: right;
      background: none;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      font: inherit;
    }
    .chip .pin.on { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <strong>Klar</strong>
    <nav>
      <button class="active" data-tab="parse">Satz</button>
      <button data-tab="custom">Sätze</button>
      <button data-tab="entities">Geräte</button>
      <button data-tab="calibrate">Zuordnung</button>
      <button data-tab="settings">Einstellungen</button>
    </nav>
  </header>
  <main>
    <section id="parse">
      <label for="text">Deutscher Befehl</label>
      <textarea id="text">Mach das Licht im Wohnzimmer und in der Küche an und stell die Heizung auf 23</textarea>
      <div class="row">
        <button class="act" id="send">Zerlegen</button>
        <span id="speech" style="color:var(--muted)"></span>
      </div>
      <pre id="out">{}</pre>
    </section>
    <section id="custom" class="hidden">
      <label>Eigene Sätze (JSON-Liste: phrase, intent, slots)</label>
      <textarea id="customBox">[]</textarea>
      <div class="row"><button class="act" id="saveCustom">Speichern</button></div>
    </section>
    <section id="entities" class="hidden">
      <table>
        <thead><tr><th>Gerät</th><th>Raum</th><th>Tags</th></tr></thead>
        <tbody id="ents"></tbody>
      </table>
    </section>
    <section id="calibrate" class="hidden">
      <p class="hint">
        Nur für Assist freigegebene Geräte, die das Language Pack nicht eindeutig trifft.
        Ziehen auf einen Raum. Spitzname ist das gesprochene Wort.
      </p>
      <label>Ohne Raum</label>
      <div class="pool" id="pool" data-area=""></div>
      <div id="rooms"></div>
      <div class="row"><span id="calStatus" style="color:var(--muted)"></span></div>
    </section>
    <section id="settings" class="hidden">
      <label>Persönlichkeit</label>
      <select id="personality">
        <option value="default">Normal</option>
        <option value="butler">Butler</option>
        <option value="locker">Locker</option>
        <option value="fuersorglich">Fürsorglich</option>
        <option value="party">Party</option>
        <option value="grantig">Grantig</option>
        <option value="sarkastisch">Sarkastisch</option>
        <option value="pirat">Pirat</option>
        <option value="hippie">Hippie</option>
        <option value="gollum">Gollum</option>
      </select>
      <label>Modus</label>
      <select id="mode">
        <option value="full">Geräte + Kontext</option>
        <option value="context_only">Nur Kontext</option>
      </select>
      <label>Write-Token (LAN)</label>
      <input id="token" type="password" autocomplete="off" placeholder="aus Addon-Log oder /data/klar_token">
      <div class="row"><button class="act" id="saveSet">Speichern</button></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s || "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
    const tokenHeaders = () => {
      const token = ($("token") && $("token").value.trim()) || localStorage.getItem("klar_token") || new URLSearchParams(location.search).get("token") || "";
      return token ? { "x-klar-token": token } : {};
    };
    const api = (path, opts = {}) => fetch(path, {
      ...opts,
      headers: { "content-type": "application/json", ...tokenHeaders(), ...(opts.headers || {}) },
    });
    document.querySelectorAll("nav button").forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        ["parse", "custom", "entities", "calibrate", "settings"].forEach((id) => {
          $(id).classList.toggle("hidden", id !== btn.dataset.tab);
        });
      };
    });
    $("send").onclick = async () => {
      const res = await api("/api/parse", {
        method: "POST",
        body: JSON.stringify({ text: $("text").value }),
      });
      const data = await res.json();
      $("speech").textContent = data.speech || "";
      $("out").textContent = JSON.stringify(data, null, 2);
    };
    $("saveCustom").onclick = async () => {
      const body = JSON.parse($("customBox").value || "[]");
      await api("/api/custom", { method: "POST", body: JSON.stringify(body) });
    };
    $("saveSet").onclick = async () => {
      const token = $("token").value.trim();
      if (token) localStorage.setItem("klar_token", token);
      await api("/api/settings", {
        method: "POST",
        body: JSON.stringify({
          personality: $("personality").value,
          mode: $("mode").value,
        }),
      });
    };
    (async () => {
      const ents = await (await api("/api/entities")).json();
      $("ents").innerHTML = ents.map((e) =>
        `<tr><td>${esc(e.name)}<br><span style="color:#9a9083">${esc(e.entity_id)}</span></td><td>${esc(e.area || "")}</td><td>${esc((e.tags || []).join(", "))}</td></tr>`
      ).join("");
      const gaps = await (await api("/api/gaps")).json();
      const board = { leftover: gaps.leftover, rooms: gaps.rooms };
      const chip = (e) => {
        const pref = (e.tags || []).includes("preferred");
        const nick = (e.aliases || []).join(", ");
        const pin = e.domain === "light"
          ? `<button type="button" class="pin${pref ? " on" : ""}" data-pin title="Standardlicht">★</button>`
          : "";
        return `<div class="chip" draggable="true" data-id="${esc(e.entity_id)}" data-area="${esc(e.area || "")}">
          ${pin}${esc(e.name)}<small>${esc(e.entity_id)}</small>
          <input data-nick placeholder="Spitzname" value="${esc(nick)}">
        </div>`;
      };
      const paint = () => {
        const pool = board.leftover.filter((e) => !e.area);
        $("pool").innerHTML = pool.length
          ? pool.map(chip).join("")
          : '<span style="color:var(--muted)">Nichts offen.</span>';
        $("rooms").innerHTML = board.rooms.map((r) => {
          const here = board.leftover.filter((e) => e.area === r.area_id);
          return `<div class="room"><h3>${esc(r.name)}</h3>
            <div class="well" data-area="${esc(r.area_id)}">${here.map(chip).join("")}</div></div>`;
        }).join("");
        bind();
      };
      const save = async (el, extra) => {
        const id = el.dataset.id;
        const aliases = (el.querySelector("[data-nick]").value || "")
          .split(",").map((s) => s.trim()).filter(Boolean);
        const pin = el.querySelector("[data-pin]");
        const preferred = !!(pin && pin.classList.contains("on"));
        await api("/api/entities", {
          method: "POST",
          body: JSON.stringify({ entity_id: id, aliases, preferred, ...extra }),
        });
        const item = board.leftover.find((e) => e.entity_id === id);
        if (item) {
          item.aliases = aliases;
          item.tags = preferred ? ["preferred"] : [];
          if (Object.prototype.hasOwnProperty.call(extra, "area")) {
            item.area = extra.area || null;
          }
        }
        $("calStatus").textContent = "Gespeichert.";
      };
      const bind = () => {
        document.querySelectorAll(".chip").forEach((el) => {
          el.ondragstart = (ev) => {
            if (ev.target.closest("input, button")) {
              ev.preventDefault();
              return;
            }
            ev.dataTransfer.setData("text/plain", el.dataset.id);
          };
          el.querySelector("[data-nick]").onchange = () => save(el, {});
          const pin = el.querySelector("[data-pin]");
          if (pin) {
            pin.onclick = (ev) => {
              ev.preventDefault();
              pin.classList.toggle("on");
              save(el, {});
            };
          }
        });
        document.querySelectorAll(".pool, .well").forEach((well) => {
          well.ondragover = (ev) => { ev.preventDefault(); well.classList.add("over"); };
          well.ondragleave = () => well.classList.remove("over");
          well.ondrop = async (ev) => {
            ev.preventDefault();
            well.classList.remove("over");
            const id = ev.dataTransfer.getData("text/plain");
            const el = document.querySelector(`.chip[data-id="${CSS.escape(id)}"]`);
            if (!el) return;
            await save(el, { area: well.dataset.area || "" });
            const next = await (await api("/api/gaps")).json();
            board.leftover = next.leftover;
            board.rooms = next.rooms;
            paint();
          };
        });
      };
      paint();
      const custom = await (await api("/api/custom")).json();
      $("customBox").value = JSON.stringify(custom, null, 2);
      const set = await (await api("/api/settings")).json();
      $("personality").value = set.personality;
      $("mode").value = set.mode;
      const stored = localStorage.getItem("klar_token") || new URLSearchParams(location.search).get("token") || "";
      if (stored) $("token").value = stored;
    })();
  </script>
</body>
</html>
